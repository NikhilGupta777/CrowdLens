[project]
name = "crowdlens"
version = "0.1.0"
description = "Real-time AI-powered surveillance and anomaly detection (single-user, Windows-local)."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110.0",
    "filterpy>=1.4.5",
    "huggingface_hub>=0.25.0",
    "numpy>=1.24.0",
    "onnx>=1.15.0",
    "onnxruntime-gpu>=1.16.0",
    "onnxslim>=0.1.90",
    "openai>=1.0.0",
    "opencv-python-headless>=4.8.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.9",
    "scipy>=1.11.0",
    "torch>=2.5.1,<2.6",
    "torchvision>=0.20.1,<0.21",
    "ultralytics>=8.0.0",
    "uvicorn[standard]>=0.29.0",
    "websockets>=12.0",
]

# Optional explicit PyTorch index mirrors. uv will only consult these when a
# package is mapped to one via [tool.uv.sources]. Leaving them defined makes
# it trivial to pin torch/torchvision to the CPU or CUDA wheel index without
# editing the dependency string above. None of the third-party packages
# previously listed under [tool.uv.sources] were ever used by this project,
# so they were removed.
[[tool.uv.index]]
explicit = true
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"

[[tool.uv.index]]
explicit = true
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"

# Map torch and torchvision to the right wheel index per platform. On Linux
# we default to the CPU wheels (the project's primary deployment target is
# Windows where the standard PyPI wheels are CUDA-capable when a CUDA
# runtime is present). Override by editing this table or by setting
# UV_INDEX_STRATEGY at install time.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "platform_system == 'Linux'" }]
